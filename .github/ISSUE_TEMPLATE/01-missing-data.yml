name: إضافة بيانات أو مورد
description: اقترح مؤسسة أو مسارًا أو مادة أو موردًا تعليميًا موثقًا.
title: "[إضافة]: "
labels: ["اقتراح", "بيانات"]
body:
  - type: dropdown
    id: type
    attributes:
      label: نوع الإضافة
      options: [مؤسسة, مسار أو شهادة, مادة أو وحدة, درس أو تمرين, امتحان, بحث أو مرجع, فيديو أو قناة, إعلان أو موعد, أخرى]
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: الاسم أو العنوان
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: رابط المصدر المباشر
      description: فضّل المصدر الرسمي أو صاحب المحتوى.
    validations:
      required: true
  - type: input
    id: checked
    attributes:
      label: تاريخ التحقق
      placeholder: YYYY-MM-DD
  - type: dropdown
    id: license
    attributes:
      label: الترخيص المعروف للمورد
      options: [غير معروف, CC BY, CC BY-SA, ملكية عامة, إذن صريح, رابط فقط دون إعادة نشر]
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: تفاصيل المستوى والمادة والولاية واللغة
  - type: checkboxes
    id: privacy
    attributes:
      label: الخصوصية والحقوق
      options:
        - label: لا تتضمن الإضافة بيانات شخصية، ولا أرفع محتوى لا أملك حق إعادة نشره.
          required: true
